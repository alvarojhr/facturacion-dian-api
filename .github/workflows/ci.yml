name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect markdown-only changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"

            if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")

          echo "Changed files:"
          printf '%s\n' "${changed_files[@]}"

          docs_only=true
          for file in "${changed_files[@]}"; do
            if [[ "$file" != *.md ]]; then
              docs_only=false
              break
            fi
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Skip heavy CI for markdown-only changes
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only .md files changed; skipping heavy validation steps."

      - name: Validate public docs and examples
        run: python3 scripts/validate_public_docs.py

      - uses: actions/setup-python@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/server/pyproject.toml

      - name: Install packages
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/core -e "./packages/server[dev]"

      - name: Validate skill metadata
        if: steps.changes.outputs.docs_only != 'true'
        run: python scripts/validate_skill.py

      - name: Ruff
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m ruff check .

      - name: Mypy
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m mypy packages/core/src packages/server/src

      - name: Pytest
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pytest

      # Supply-chain scan: revisa el lockfile contra la base de
      # vulnerabilidades de PyPI. Falla la build si hay CVE conocido.
      - name: pip-audit
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock

      - name: Build Docker image
        if: steps.changes.outputs.docs_only != 'true'
        run: docker build -t facturacion-dian-api .

      - name: Gitleaks
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --redact -v --exit-code=2 --log-opts=-1

  # Autoversionado: al mergear a main con CI verde (y si cambió algo que altera
  # la imagen, no solo docs), calcula el siguiente tag patch semver y lo empuja.
  # El push del tag dispara release.yml → publica la imagen a GHCR → avisa al
  # repo ferreterias-invoicing para que despliegue. Así un merge llega a
  # producción sin cortar tags a mano.
  #
  # Solo hace bump de patch. Para un minor/major, corta el tag manualmente
  # (git tag vX.Y.0 && git push --tags): release.yml lo maneja igual.
  tag-release:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      # IMPORTANTE: el tag se empuja con RELEASE_PAT (un PAT), NO con el
      # GITHUB_TOKEN por defecto. GitHub suprime los eventos originados por el
      # GITHUB_TOKEN para evitar recursión, así que un tag empujado con él NO
      # dispararía release.yml. Con un PAT, el push del tag sí dispara el build +
      # publicación en GHCR. El mismo PAT lo reusa release.yml para el dispatch
      # cruzado a ferreterias-invoicing (ver docs/runbooks en ese repo).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute next patch tag
        id: next
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          ver=${latest#v}
          major=${ver%%.*}
          rest=${ver#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          next="v${major}.${minor}.$((patch + 1))"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Último tag: ${latest} → nuevo: ${next}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.tag }}" -m "release ${{ steps.next.outputs.tag }} (auto)"
          git push origin "${{ steps.next.outputs.tag }}"
