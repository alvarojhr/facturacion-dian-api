name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # El contexto `secrets` no se puede leer en un `if:` de step; se expone vía
    # `env` a nivel de job (donde sí está permitido) para poder gatear el
    # dispatch cuando el PAT no está configurado. RELEASE_PAT es el mismo PAT que
    # ci.yml usa para empujar el tag (scope en ambos repos).
    env:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reproduce approved release
        id: contract
        run: |
          # Esta rama sirve el contrato incompatible 0.2: nunca publicar como v1.
          [[ "$GITHUB_REF_NAME" =~ ^v([2-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+$ ]]
          python -m venv /tmp/dian-build
          /tmp/dian-build/bin/python -m pip install --no-deps --require-hashes -r requirements-build.lock
          /tmp/dian-build/bin/python scripts/build_reproducible_wheels.py
          echo "version=$(jq -r '.versions.server' release/manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v1.') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the image before publishing
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker run --rm --network none "$IMAGE" python -I /opt/dian-release/verify_release.py --artifact-dir /opt/dian-release --runtime
          docker run --rm --network none -v "$PWD/scripts/smoke_release.py:/tmp/smoke_release.py:ro" "$IMAGE" python -I /tmp/smoke_release.py

      - name: Publish the verified image and record its digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -z "$tag" || docker push "$tag"
          done <<< "$TAGS"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "${IMAGE}@${digest}" | tee dist/release/image-digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dian-release-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error

      - name: Keep latest on the published v1 line
        if: ${{ !startsWith(github.ref_name, 'v1.') }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          # metadata-action genera latest también con type=ref,event=tag.
          # Desactivar ese comportamiento y restaurar el último v1 publicado.
          legacy_tag="$(git tag -l 'v1.*.*' --sort=-v:refname | head -n1)"
          [[ "$legacy_tag" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          digest="$(docker buildx imagetools inspect "${IMAGE}:${legacy_tag}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${digest}"
          actual="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
          test "$actual" = "$digest"
          echo "latest conserva ${legacy_tag} por digest verificado"

      # Avisa al repo privado ferreterias-invoicing que ya hay imagen nueva en
      # GHCR para este tag, para que despliegue los dian-* a Cloud Run. Va DESPUÉS
      # del push, así el mirror del otro repo siempre encuentra la imagen.
      #
      # RELEASE_PAT: PAT fine-grained con "Contents: write" sobre AMBOS repos —
      # facturacion-dian-api (ci.yml empuja el tag con él) y
      # ferreterias-invoicing (aquí, lo exige POST /repos/{owner}/{repo}/dispatches).
      # Si no está configurado, el paso se salta con un aviso en vez de fallar el
      # release (la imagen ya quedó publicada); el deploy se lanza a mano.
      - name: Trigger ferreterias-invoicing deploy
        # La línea v2 requiere que el consumidor confirme su migración antes
        # de reemplazar servicios que todavía reciben el contrato anterior.
        if: ${{ env.RELEASE_PAT != '' && (startsWith(github.ref_name, 'v1.') || vars.DOWNSTREAM_HTTP_CONTRACT == steps.contract.outputs.version) }}
        env:
          GH_TOKEN: ${{ env.RELEASE_PAT }}
        run: |
          jq -nc --arg tag "${{ github.ref_name }}" \
            '{event_type: "dian-image-published", client_payload: {tag: $tag}}' \
          | gh api repos/alvarojhr/ferreterias-invoicing/dispatches \
              --method POST --input -
          echo "Dispatch enviado a ferreterias-invoicing con tag ${{ github.ref_name }}"

      - name: Consumer migration required
        if: ${{ !startsWith(github.ref_name, 'v1.') && vars.DOWNSTREAM_HTTP_CONTRACT != steps.contract.outputs.version }}
        run: echo "Imagen publicada; despliegue automático pendiente de confirmar la versión exacta del contrato publicada."

      - name: Warn if deploy token missing
        if: ${{ env.RELEASE_PAT == '' }}
        run: |
          echo "::warning::RELEASE_PAT no está configurado; imagen publicada en GHCR pero NO se disparó el deploy del repo ferreterias-invoicing. Configura el PAT o dispara deploy-dian.yml a mano."
